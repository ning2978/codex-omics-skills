name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check deterministic catalog
        run: python scripts/build_catalog.py --check
      - name: Validate skills and portability
        run: python scripts/validate_repo.py
      - name: Exercise isolated installs and dependency closure
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
